<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Admin Panel - RND Staking</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Inter', sans-serif; margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #080e1a; color: #f0f4ff; min-height: 100vh; }

        /* ============ NAVBAR ============ */
        .navbar-custom {
            background: rgba(8,14,26,0.95);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(46,204,113,0.15);
            padding: 10px 0;
            position: sticky; top: 0; z-index: 1050;
        }
        .navbar-custom .navbar-brand { font-weight: 800; font-size: 1.2rem; color: #fff !important; }
        .navbar-custom .navbar-brand i { color: #2ecc71; }
        .admin-badge {
            background: rgba(239,68,68,0.15);
            border: 1px solid rgba(239,68,68,0.2);
            border-radius: 30px; padding: 4px 14px;
            font-size: 0.65rem; color: #f87171; font-weight: 600;
        }

        .dashboard-container { padding: 20px; max-width: 1400px; margin: 0 auto; }

        /* ============ CARDS ============ */
        .card-glass {
            background: rgba(19,34,55,0.8);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(46,204,113,0.1);
            border-radius: 20px;
            padding: 1.5rem;
            transition: all 0.3s ease;
        }
        .card-glass:hover { border-color: rgba(46,204,113,0.3); }
        .card-glass .card-title { font-size: 1rem; font-weight: 600; color: #fff; margin-bottom: 15px; }
        .card-glass .card-title i { color: #2ecc71; margin-right: 8px; }

        /* ============ STAT CARDS ============ */
        .stat-card {
            background: rgba(19,34,55,0.6);
            border: 1px solid rgba(46,204,113,0.08);
            border-radius: 16px;
            padding: 1.25rem;
            transition: all 0.3s ease;
            text-align: center;
        }
        .stat-card:hover { border-color: rgba(46,204,113,0.2); transform: translateY(-3px); }
        .stat-card .stat-icon {
            width: 44px; height: 44px; border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.2rem; margin: 0 auto 10px;
        }
        .stat-card .stat-icon.green { background: rgba(46,204,113,0.12); color: #2ecc71; }
        .stat-card .stat-icon.blue { background: rgba(59,130,246,0.12); color: #60a5fa; }
        .stat-card .stat-icon.orange { background: rgba(251,191,36,0.12); color: #fbbf24; }
        .stat-card .stat-icon.red { background: rgba(239,68,68,0.12); color: #f87171; }
        .stat-card .stat-icon.purple { background: rgba(139,92,246,0.12); color: #a78bfa; }
        .stat-card .stat-icon.teal { background: rgba(52,211,153,0.12); color: #34d399; }
        .stat-card .stat-number { font-size: 1.8rem; font-weight: 800; color: #fff; }
        .stat-card .stat-label { color: #8899bb; font-size: 0.8rem; font-weight: 500; margin-top: 4px; }

        /* ============ TABLES ============ */
        .table-custom { color: #f0f4ff; border-color: #1f334f; }
        .table-custom th { border-bottom: 2px solid #2a3a5a; color: #a0b8d0; font-weight: 600; font-size: 0.8rem; }
        .table-custom td { border-color: #1f334f; vertical-align: middle; font-size: 0.85rem; }
        .table-custom tr:hover { background: rgba(46,204,113,0.03); }

        /* ============ BUTTONS ============ */
        .btn-success-custom { background: #2ecc71; border: none; color: #0b1120; font-weight: 600; padding: 6px 16px; border-radius: 8px; transition: all 0.3s ease; font-size: 0.8rem; }
        .btn-success-custom:hover { background: #27ae60; color: #fff; transform: translateY(-1px); }
        .btn-danger-custom { background: #ef4444; border: none; color: #fff; font-weight: 600; padding: 6px 16px; border-radius: 8px; transition: all 0.3s ease; font-size: 0.8rem; }
        .btn-danger-custom:hover { background: #dc2626; color: #fff; transform: translateY(-1px); }
        .btn-warning-custom { background: #fbbf24; border: none; color: #0b1120; font-weight: 600; padding: 6px 16px; border-radius: 8px; transition: all 0.3s ease; font-size: 0.8rem; }
        .btn-warning-custom:hover { background: #f59e0b; color: #fff; transform: translateY(-1px); }
        .btn-primary-custom {
            background: linear-gradient(135deg, #2ecc71, #27ae60);
            border: none; color: #fff; font-weight: 600;
            padding: 10px 24px; border-radius: 12px;
            transition: all 0.3s ease; text-decoration: none;
            display: inline-block; font-size: 0.9rem;
        }
        .btn-primary-custom:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(46,204,113,0.3); color: #fff; }

        .btn-copy {
            background: rgba(46,204,113,0.1);
            border: 1px solid rgba(46,204,113,0.2);
            color: #2ecc71; padding: 4px 10px;
            border-radius: 6px; font-size: 0.7rem;
            cursor: pointer; transition: all 0.3s ease;
            display: inline-flex; align-items: center; gap: 4px;
            font-weight: 500;
        }
        .btn-copy:hover { background: rgba(46,204,113,0.25); transform: scale(1.05); }
        .btn-copy.copied {
            background: rgba(52,211,153,0.25);
            color: #34d399;
            border-color: rgba(52,211,153,0.4);
        }

        /* ============ BADGES ============ */
        .badge-pending { background: rgba(251,191,36,0.15); color: #fbbf24; padding: 4px 12px; border-radius: 20px; font-weight: 500; font-size: 0.7rem; }
        .badge-approved { background: rgba(46,204,113,0.15); color: #2ecc71; padding: 4px 12px; border-radius: 20px; font-weight: 500; font-size: 0.7rem; }
        .badge-rejected { background: rgba(239,68,68,0.15); color: #f87171; padding: 4px 12px; border-radius: 20px; font-weight: 500; font-size: 0.7rem; }
        .badge-active { background: rgba(46,204,113,0.15); color: #2ecc71; padding: 4px 12px; border-radius: 20px; font-weight: 500; font-size: 0.7rem; }
        .badge-completed { background: rgba(59,130,246,0.15); color: #60a5fa; padding: 4px 12px; border-radius: 20px; font-weight: 500; font-size: 0.7rem; }
        .badge-paid { background: rgba(52,211,153,0.15); color: #34d399; padding: 4px 12px; border-radius: 20px; font-weight: 500; font-size: 0.7rem; }
        .badge-available { background: rgba(96,165,250,0.15); color: #60a5fa; padding: 4px 12px; border-radius: 20px; font-weight: 500; font-size: 0.7rem; }

        /* ============ TAB COUNT BADGE ============ */
        .tab-count-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 20px;
            height: 20px;
            padding: 0 6px;
            border-radius: 10px;
            font-size: 0.68rem;
            font-weight: 700;
            margin-left: 6px;
            background: rgba(46,204,113,0.2);
            color: #2ecc71;
            border: 1px solid rgba(46,204,113,0.3);
        }
        .tab-count-badge.pending {
            background: rgba(251,191,36,0.2);
            color: #fbbf24;
            border-color: rgba(251,191,36,0.4);
            animation: pulseBadge 2s infinite;
        }
        .tab-count-badge.danger {
            background: rgba(239,68,68,0.2);
            color: #f87171;
            border-color: rgba(239,68,68,0.4);
        }
        @keyframes pulseBadge {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        /* ============ SEARCH BOX ============ */
        .search-box {
            background: rgba(8,14,26,0.6);
            border: 1px solid rgba(46,204,113,0.1);
            border-radius: 12px; padding: 8px 16px;
            color: #f0f4ff; width: 100%; max-width: 300px;
        }
        .search-box:focus { border-color: #2ecc71; outline: none; box-shadow: 0 0 0 3px rgba(46,204,113,0.1); }
        .search-box::placeholder { color: #556688; }

        /* ============ USER SEARCH (TOP SECTION) ============ */
        .user-search-section {
            background: linear-gradient(135deg, rgba(46,204,113,0.06), rgba(96,165,250,0.04));
            border: 1px solid rgba(46,204,113,0.15);
            border-radius: 20px;
            padding: 1.5rem;
            margin-bottom: 20px;
        }
        .user-search-section .section-title {
            color: #fff; font-weight: 700; font-size: 1.05rem;
            margin-bottom: 12px; display: flex; align-items: center; gap: 10px;
        }
        .user-search-section .section-title i { color: #2ecc71; }
        .user-search-input-wrap { position: relative; }
        .user-search-input-wrap .search-icon {
            position: absolute; left: 16px; top: 50%;
            transform: translateY(-50%); color: #556688;
        }
        .user-search-input-wrap input {
            background: rgba(8,14,26,0.7);
            border: 2px solid rgba(46,204,113,0.15);
            border-radius: 14px;
            padding: 14px 16px 14px 46px;
            color: #f0f4ff; width: 100%; font-size: 0.95rem;
            transition: all 0.3s ease;
        }
        .user-search-input-wrap input:focus {
            outline: none; border-color: #2ecc71;
            box-shadow: 0 0 0 4px rgba(46,204,113,0.1);
        }
        .user-search-input-wrap input::placeholder { color: #556688; }

        .search-results-list {
            max-height: 380px; overflow-y: auto;
            margin-top: 12px; padding-right: 4px;
        }
        .search-result-item {
            background: rgba(8,14,26,0.5);
            border: 1px solid rgba(46,204,113,0.08);
            border-radius: 14px;
            padding: 14px 16px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex; align-items: center; gap: 14px;
        }
        .search-result-item:hover {
            border-color: rgba(46,204,113,0.35);
            background: rgba(8,14,26,0.85);
            transform: translateX(4px);
        }
        .search-result-item .avatar-sm {
            width: 42px; height: 42px;
            border-radius: 12px;
            background: linear-gradient(135deg, #2ecc71, #27ae60);
            color: #fff; font-weight: 700;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
        }
        .search-result-item .info { flex: 1; min-width: 0; }
        .search-result-item .info .name { color: #fff; font-weight: 600; font-size: 0.9rem; }
        .search-result-item .info .meta { color: #8899bb; font-size: 0.75rem; margin-top: 2px; }
        .search-result-item .info .referred-by {
            color: #60a5fa; font-size: 0.72rem; margin-top: 4px;
            display: flex; align-items: center; gap: 6px;
        }
        .search-result-item .info .referred-by i { color: #2ecc71; }
        .search-result-item .arrow { color: #556688; font-size: 1.2rem; }

        /* ============ ACTIVITY FEED ============ */
        .activity-feed {
            max-height: 620px; overflow-y: auto;
            padding-right: 8px;
        }
        .activity-feed::-webkit-scrollbar { width: 6px; }
        .activity-feed::-webkit-scrollbar-track { background: rgba(46,204,113,0.03); border-radius: 10px; }
        .activity-feed::-webkit-scrollbar-thumb { background: rgba(46,204,113,0.25); border-radius: 10px; }

        .activity-card {
            display: flex; align-items: flex-start;
            gap: 14px; padding: 14px 16px;
            background: rgba(8,14,26,0.5);
            border: 1px solid rgba(46,204,113,0.06);
            border-radius: 14px; margin-bottom: 10px;
            transition: all 0.3s ease;
            position: relative; overflow: hidden;
        }
        .activity-card:hover {
            border-color: rgba(46,204,113,0.2);
            background: rgba(8,14,26,0.75);
            transform: translateX(4px);
        }
        .activity-card::before {
            content: ''; position: absolute;
            left: 0; top: 0; bottom: 0; width: 3px;
            background: #2ecc71;
        }
        .activity-card.type-user::before { background: #2ecc71; }
        .activity-card.type-package::before { background: #a78bfa; }
        .activity-card.type-deposit::before { background: #60a5fa; }
        .activity-card.type-withdrawal::before { background: #fbbf24; }
        .activity-card.type-direct-offer::before { background: #f59e0b; }
        .activity-card.type-admin::before { background: #34d399; }
        .activity-card.type-reward::before { background: #f472b6; }
        .activity-card.type-release::before { background: #10b981; }

        .activity-icon {
            width: 42px; height: 42px; border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.15rem; flex-shrink: 0;
        }
        .activity-icon.type-user { background: rgba(46,204,113,0.12); color: #2ecc71; }
        .activity-icon.type-package { background: rgba(167,139,250,0.12); color: #a78bfa; }
        .activity-icon.type-deposit { background: rgba(96,165,250,0.12); color: #60a5fa; }
        .activity-icon.type-withdrawal { background: rgba(251,191,36,0.12); color: #fbbf24; }
        .activity-icon.type-direct-offer { background: rgba(245,158,11,0.12); color: #f59e0b; }
        .activity-icon.type-admin { background: rgba(52,211,153,0.12); color: #34d399; }
        .activity-icon.type-reward { background: rgba(244,114,182,0.12); color: #f472b6; }
        .activity-icon.type-release { background: rgba(16,185,129,0.12); color: #10b981; }

        .activity-content { flex: 1; min-width: 0; }
        .activity-title {
            font-weight: 600; color: #fff; font-size: 0.88rem;
            margin-bottom: 3px; display: flex;
            align-items: center; gap: 8px; flex-wrap: wrap;
        }
        .activity-desc { color: #8899bb; font-size: 0.78rem; line-height: 1.5; word-break: break-word; }
        .activity-meta {
            display: flex; align-items: center; gap: 12px;
            margin-top: 6px; flex-wrap: wrap;
            font-size: 0.7rem; color: #556688;
        }
        .activity-meta .rel-time { color: #2ecc71; font-weight: 600; }
        .activity-meta .ref-id {
            font-family: monospace; color: #60a5fa;
            background: rgba(96,165,250,0.06);
            padding: 1px 6px; border-radius: 4px;
        }
        .activity-amount { font-weight: 700; font-size: 0.85rem; }
        .activity-amount.credit { color: #2ecc71; }
        .activity-amount.debit { color: #f87171; }

        .activity-status-badge {
            font-size: 0.65rem; padding: 2px 10px;
            border-radius: 20px; font-weight: 600;
            text-transform: uppercase; letter-spacing: 0.3px;
        }

        /* ============ DIRECT OFFER TIERS ============ */
        .offer-tier-card {
            background: rgba(251,191,36,0.04);
            border: 1px solid rgba(251,191,36,0.12);
            border-radius: 12px; padding: 12px 14px;
            text-align: center; transition: all 0.3s ease;
        }
        .offer-tier-card:hover { border-color: rgba(251,191,36,0.3); transform: translateY(-2px); }
        .offer-tier-card .tier-amount { font-size: 0.7rem; color: #fbbf24; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
        .offer-tier-card .tier-count { font-size: 1.5rem; font-weight: 800; color: #fff; margin: 4px 0; }
        .offer-tier-card .tier-label { font-size: 0.65rem; color: #8899bb; }

        /* ============ FORM CONTROLS ============ */
        .form-control-custom {
            background: rgba(8,14,26,0.8) !important;
            border: 1px solid rgba(46,204,113,0.15) !important;
            color: #f0f4ff !important;
            padding: 12px 16px !important;
            border-radius: 12px !important;
            font-size: 0.95rem;
            transition: all 0.3s ease;
        }
        .form-control-custom:focus {
            border-color: #2ecc71 !important;
            box-shadow: 0 0 0 3px rgba(46,204,113,0.15) !important;
            background: rgba(8,14,26,0.9) !important;
        }
        .form-control-custom::placeholder { color: #556688 !important; }
        .form-label { font-weight: 600; color: #a0b8d0; font-size: 0.9rem; margin-bottom: 6px; }

        /* ============ INFO ROWS ============ */
        .info-row {
            display: flex; justify-content: space-between;
            padding: 12px 0; border-bottom: 1px solid rgba(46,204,113,0.06);
        }
        .info-row .label { color: #8899bb; font-size: 0.85rem; }
        .info-row .value { color: #f0f4ff; font-weight: 500; font-size: 0.95rem; }

        /* ============ TABS ============ */
        .nav-tabs-custom .nav-link {
            color: #8899bb; border: none;
            padding: 10px 20px; font-weight: 500;
            border-radius: 12px; transition: all 0.3s ease;
            cursor: pointer; font-size: 0.85rem;
            display: inline-flex; align-items: center;
        }
        .nav-tabs-custom .nav-link:hover { color: #fff; background: rgba(46,204,113,0.05); }
        .nav-tabs-custom .nav-link.active { color: #2ecc71; background: rgba(46,204,113,0.1); }
        .nav-tabs-custom .nav-link i { margin-right: 8px; }

        /* ============ TOAST ============ */
        .toast-container { position: fixed; top: 20px; right: 20px; z-index: 9999; max-width: 400px; }
        .toast-custom {
            background: rgba(19,34,55,0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(46,204,113,0.2);
            border-radius: 16px; padding: 16px 20px;
            color: #f0f4ff;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            display: flex; align-items: center; gap: 12px;
            animation: slideIn 0.4s ease; margin-bottom: 10px;
        }
        .toast-custom.success { border-left: 4px solid #2ecc71; }
        .toast-custom.error { border-left: 4px solid #ef4444; }
        .toast-custom.warning { border-left: 4px solid #fbbf24; }
        .toast-custom i { font-size: 1.5rem; }
        .toast-custom .toast-msg { flex: 1; font-size: 0.9rem; }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

        /* ============ LOADING ============ */
        .loading-spinner {
            display: flex; flex-direction: column;
            align-items: center; justify-content: center; min-height: 60vh;
        }

        /* ============ PASSWORD SCREEN ============ */
        .password-screen {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            background: linear-gradient(135deg, #080e1a 0%, #0f1f3a 50%, #1a2a4a 100%);
            display: flex; align-items: center; justify-content: center;
            z-index: 99999; padding: 20px;
        }
        .password-screen .card-glass { max-width: 420px; width: 100%; padding: 2.5rem; }
        .password-screen .logo-text { font-size: 1.8rem; font-weight: 800; color: #fff; }
        .password-screen .logo-text span { color: #2ecc71; }
        .password-screen .logo-text .admin-badge {
            font-size: 0.7rem; background: rgba(239,68,68,0.15);
            color: #f87171; padding: 4px 12px;
            border-radius: 20px; font-weight: 600; margin-left: 8px;
        }

        /* ============ DB STATUS ============ */
        .db-status {
            display: inline-flex; align-items: center; gap: 6px;
            padding: 4px 14px; border-radius: 20px;
            font-size: 0.7rem; font-weight: 600;
        }
        .db-status.connected { background: rgba(46,204,113,0.15); color: #2ecc71; }
        .db-status.error { background: rgba(239,68,68,0.15); color: #f87171; }
        .db-status.loading { background: rgba(251,191,36,0.15); color: #fbbf24; }

        /* ============ WALLET CELL ============ */
        .wallet-cell {
            display: flex; align-items: center; gap: 6px;
            max-width: 220px;
        }
        .wallet-cell .addr {
            font-family: 'Courier New', monospace;
            font-size: 0.72rem;
            color: #60a5fa;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            flex: 1;
            min-width: 0;
        }

        /* Full address display in view mode */
        .full-address {
            font-family: 'Courier New', monospace;
            font-size: 0.72rem;
            color: #60a5fa;
            background: rgba(96,165,250,0.05);
            padding: 4px 8px;
            border-radius: 6px;
            word-break: break-all;
            display: block;
            margin-top: 4px;
        }

        /* ============ NO DATA ============ */
        .no-data { text-align: center; padding: 40px 20px; }
        .no-data i { font-size: 3rem; color: #556688; margin-bottom: 15px; display: block; }
        .no-data p { color: #8899bb; }

        /* ============ RESPONSIVE ============ */
        @media (max-width: 768px) {
            .dashboard-container { padding: 15px; }
            .search-box { max-width: 100%; }
            .table-responsive { font-size: 0.8rem; }
            .stat-card .stat-number { font-size: 1.3rem; }
            .activity-card { padding: 12px; }
            .activity-icon { width: 36px; height: 36px; font-size: 1rem; }
            .wallet-cell { max-width: 140px; }
        }
        @media (max-width: 480px) { .card-glass { padding: 1rem; } }
    </style>
</head>
<body>

<div class="toast-container" id="toastContainer"></div>

<!-- ====== PASSWORD SCREEN ====== -->
<div class="password-screen" id="passwordScreen">
    <div class="card-glass text-center">
        <div class="logo-text mb-3">
            <i class="bi bi-currency-bitcoin me-2"></i>RND<span>Staking</span>
            <span class="admin-badge"><i class="bi bi-shield-lock"></i> Admin</span>
        </div>
        <p class="text-muted small mb-4">Enter admin credentials to access panel</p>

        <form id="loginForm">
            <div class="mb-3">
                <input type="email" id="adminEmail" class="form-control form-control-custom"
                       placeholder="Admin Email" value="admin@rndstaking.com" required>
            </div>
            <div class="mb-3">
                <input type="password" id="adminPasswordInput" class="form-control form-control-custom"
                       placeholder="Enter password" autofocus required>
            </div>
            <button type="submit" class="btn-primary-custom" id="loginBtn">
                <i class="bi bi-shield-lock me-2"></i>Login
            </button>
        </form>
        <p class="text-muted small mt-3">
            <i class="bi bi-info-circle me-1"></i> Email: admin@rndstaking.com
        </p>
